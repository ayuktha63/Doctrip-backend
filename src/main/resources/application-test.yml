spring:
  datasource:
    url: jdbc:h2:mem:doctrip_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

doctrip:
  cors:
    allowed-origin: http://localhost:4300

logging:
  level:
    root: INFO
