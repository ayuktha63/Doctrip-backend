server:
  port: 8081

spring:
  application:
    name: doctrip-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/doctrip}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

doctrip:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-please-please}
    expiry-seconds: 1800
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:4200}
  otp:
    validity-seconds: 300
    max-attempts: 5
    resend-cooldown-seconds: 30
    length: 6

logging:
  config: classpath:logback-spring.xml
