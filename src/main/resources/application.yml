server:
  port: 8081

spring:
  application:
    name: doctrip-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/doctrip}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

doctrip:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:4300}
