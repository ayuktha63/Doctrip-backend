server:
  port: 8081

spring:
  application:
    name: doctrip-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/doctrip}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_SMTP_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:changeme-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:changeme-google-client-secret}
            scope: openid, email, profile
          apple:
            client-id: ${APPLE_CLIENT_ID:changeme-apple-service-id}
            client-secret: ${APPLE_CLIENT_SECRET:changeme-apple-client-secret}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid, email, name
            client-name: Apple
        provider:
          apple:
            authorization-uri: https://appleid.apple.com/auth/authorize?response_mode=form_post
            token-uri: https://appleid.apple.com/auth/token
            jwk-set-uri: https://appleid.apple.com/auth/keys
            user-name-attribute: sub

doctrip:
  jwt:
    secret: ${JWT_SECRET:changeme-not-for-production-use}
    expiry-seconds: 1800
    refresh-expiry-seconds: 2592000
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:4200}
  otp:
    validity-seconds: 300
    max-attempts: 5
    resend-cooldown-seconds: 30
    length: 6
  oauth2:
    frontend-redirect-uri: ${OAUTH2_FRONTEND_REDIRECT_URI:http://localhost:4200/auth/callback}
  mail:
    from: ${MAIL_FROM:no-reply@doctrip.example}
    imap-host: ${MAIL_IMAP_HOST:${MAIL_HOST:localhost}}
    imap-port: ${MAIL_IMAP_PORT:993}
    api-base-url: ${API_BASE_URL:http://localhost:8081}
